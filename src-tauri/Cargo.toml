[package]
name = "pc-optimizer"
version = "0.1.0"
description = "PC Optimizer - power-user suite"
authors = ["PC Optimizer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pc_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
