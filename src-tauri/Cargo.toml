[package]
name = "win-optimizer-pro"
version = "2.1.4"
description = "Win-Optimizer-Pro - power-user suite"
authors = ["Win-Optimizer-Pro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "win_optimizer_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
