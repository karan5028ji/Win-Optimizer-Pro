name: Sign Release (SignPath)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v2.1.6)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  sign:
    name: Sign installer with SignPath
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      # Pinned to commit SHAs, not mutable tags - see the note in ci.yml.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download unsigned installer from release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          tag: ${{ github.event.inputs.tag }}
          fileName: "Win-Optimizer-Pro_*_x64-setup.exe"
          out-file-path: unsigned

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer
          path: unsigned/*.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: sign
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The updater .sig is a signature over the exact installer bytes, so it
      # must be recomputed over the Authenticode-signed file.
      - name: Re-sign updater signature
        shell: bash
        run: |
          SIGNED="$(find signed -name '*.exe' | head -n1)"
          echo "Signed installer: $SIGNED"
          npx tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --file "$SIGNED" \
            --output "${SIGNED}.sig"

      - name: Upload signed installer back to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            signed/*.exe
            signed/*.exe.sig
