name: Bug report
description: Report a reproducible bug in Win-Optimizer-Pro
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below. Bug reports with
        reproduction steps are fixed much faster.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you using? (check the app window title or the release tag)
      placeholder: e.g. 2.1.4
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Which tab / button / operation?
      placeholder: |
        1. Open the app
        2. Go to Cleanup
        3. Click "Run"
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste any console output or error text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / error logs
      description: Paste relevant log lines from the app console or `optimizer.log` if available.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I ran the latest release version before reporting
        - label: I searched existing issues and this is not a duplicate
